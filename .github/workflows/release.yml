name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (e.g. v0.1.0). Leave empty to use package.json version.'
        required: false
        type: string

permissions:
  contents: write
  id-token: write
  packages: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Publish npm + GHCR + GitHub Release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Do NOT set registry-url here — it writes an .npmrc with empty
      # _authToken that breaks npm Trusted Publishing (OIDC) and surfaces as E404.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Ensure npm CLI supports Trusted Publishing
        run: |
          npm install -g npm@latest
          npm --version
          node --version

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Unit tests
        run: npm test

      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          VERSION="${TAG#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=$TAG version=$VERSION (package.json=$PKG_VERSION)"
          if [[ "$VERSION" != "$PKG_VERSION" ]]; then
            echo "::error::Tag version ($VERSION) must match package.json ($PKG_VERSION). Bump package.json before tagging."
            exit 1
          fi

      - name: Publish to npm
        env:
          NPM_CONFIG_PROVENANCE: true
          # Optional: set repo/environment secret NPM_TOKEN for first-time package create
          # or as fallback when Trusted Publisher is not configured yet.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          rm -f .npmrc "$HOME/.npmrc"

          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            echo "Publishing with NPM_TOKEN (bootstrap / fallback)"
            echo "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "$HOME/.npmrc"
            echo "registry=https://registry.npmjs.org/" >> "$HOME/.npmrc"
            npm publish --access public
          else
            echo "Publishing with Trusted Publishing (OIDC)"
            # Ensure no stale token auth masks OIDC
            unset NODE_AUTH_TOKEN || true
            npx -y npm@latest publish --access public
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            LICENSE
            README.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
